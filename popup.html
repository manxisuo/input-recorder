<!DOCTYPE HTML>
<html>
  <head>
	<meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" href="style/main.css">
	<script src="script/util.js"></script>
	<script src="script/popup.js"></script>
  </head>
  <body>
	<div id="c1">
		<div id="newItem" class="row">
			<input type="text" id="newItemName" />
			<button id="add" class="icon-btn" type="button" aria-label="Add">
				<img class="icon" src="img/add.png" alt="">
			</button>
			<button id="options" class="icon-btn" type="button" aria-label="Options">
				<img class="icon" src="img/options.png" alt="">
			</button>
		</div>
		<div id="tip"></div>
	</div>
	<div id="c2">
		<label id="lblSavedItems"></label>
		<div id="c3">
			<div class="snapshot-section">
				<div id="currentSiteLabel" class="section-label"></div>
				<ul id="currentItems"></ul>
				<div id="emptyCurrent" class="empty-section"></div>
			</div>
			<div class="snapshot-section">
				<button id="toggleOther" class="section-toggle" type="button" aria-expanded="false"></button>
				<ul id="otherItems" class="collapsed"></ul>
			</div>
			<div id="empty"></div>
		</div>
	</div>
  </body>
</html>
